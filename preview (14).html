<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IELTS Vocab của tui</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#667eea,#764ba2);
color:#222;
}
h1{text-align:center;color:white;padding:25px 0;font-size:32px;}
.container{max-width:1100px;margin:auto;padding:20px;}
.card{
background:rgba(255,255,255,0.95);
border-radius:20px;
padding:25px;
margin-bottom:25px;
box-shadow:0 15px 40px rgba(0,0,0,0.2);
}
input,select,textarea{
width:100%;
padding:10px;
margin:6px 0;
border-radius:10px;
border:1px solid #ddd;
}
button{
padding:8px 14px;
border:none;
border-radius:10px;
cursor:pointer;
margin:4px;
font-weight:600;
transition:0.2s;
}
button:hover{transform:scale(1.05)}
.primary{background:#667eea;color:white}
.success{background:#22c55e;color:white}
.gray{background:#e5e7eb}
.danger{background:#ff4d4f;color:white}
.folder-btn{
display:inline-flex;
align-items:center;
background:#eee;
padding:6px 12px;
border-radius:20px;
margin:4px;
cursor:pointer;
}
.folder-btn.active{background:#667eea;color:white}
.delete-x{margin-left:8px;cursor:pointer;font-weight:bold}
.nav-buttons{text-align:center;margin-bottom:20px}
.hidden{display:none}
.flashcard{
text-align:center;
padding:60px;
font-size:24px;
border-radius:20px;
background:linear-gradient(135deg,#fdfbfb,#ebedee);
cursor:pointer;
}
.choice-btn{
display:block;
width:100%;
margin:6px 0;
background:#e5e7eb;
}
.tag{
background:#ddd;
padding:3px 8px;
border-radius:10px;
font-size:12px;
margin-left:6px;
}
.pos{
background:#667eea;
color:white;
padding:3px 8px;
border-radius:10px;
font-size:12px;
margin-left:6px;
}
</style>
</head>
<body>

<h1>📘 IELTS Vocab của tui</h1>

<div class="container">

<div class="nav-buttons">
<button class="primary" onclick="showHome()">Home</button>
<button class="primary" onclick="showFlash()">Flashcard</button>
<button class="primary" onclick="showTest()">Test</button>
<button class="primary" onclick="showGrammar()">Grammar</button>
</div>

<div id="homeSection">

<div class="card">
<h3>📁 Folder</h3>
<input id="folderInput" placeholder="New folder name">
<button class="primary" onclick="createFolder()">Create</button>
<button class="gray" onclick="renameFolder()">Rename</button>
<div id="folderList"></div>
</div>

<div class="card">
<h3>➕ Add Word</h3>
<input id="word" placeholder="Word">
<input id="meaning" placeholder="Meaning">
<input id="example" placeholder="Example">
<input id="tag" placeholder="Tag">
<select id="pos">
<option value="">Part of Speech</option>
<option>noun</option>
<option>verb</option>
<option>adjective</option>
<option>adverb</option>
<option>phrase</option>
<option>other</option>
</select>
<button class="success" onclick="addWord()">Add Word</button>
</div>

<div class="card">
<h3>📚 Word List</h3>
<div id="vocabList"></div>
</div>
</div>

<div id="flashSection" class="hidden">
<div class="card">
<h3>🧠 Flashcard</h3>
<select id="flashFolderSelect"></select>
<button onclick="startFlashcard()">Start</button>
<div id="flashcard" class="flashcard hidden" onclick="flipCard()"></div>
</div>
</div>

<div id="testSection" class="hidden">
<div class="card">
<h3>📝 Test Mode</h3>

<select id="testType">
<option value="word">Word</option>
<option value="grammar">Grammar</option>
</select>

<input type="number" id="questionLimit" placeholder="Number of questions">

<select id="testMode">
<option value="vn-en">VN → EN</option>
<option value="en-vn">EN → VN</option>
</select>

<button onclick="startTest()">Start</button>

<div id="testArea" class="hidden">
<h4 id="question"></h4>
<input id="answerInput">
<p id="feedback"></p>
<p id="score"></p>
</div>
</div>
</div>

<div id="grammarSection" class="hidden">
<div class="card">
<h3>📘 Grammar Library</h3>
<input id="grammarTitle" placeholder="Grammar Topic">
<textarea id="grammarExplanation" placeholder="Explanation"></textarea>
<textarea id="grammarFormula" placeholder="Formula"></textarea>
<textarea id="grammarExample" placeholder="Examples"></textarea>
<button class="success" onclick="addGrammar()">Add Grammar</button>
<hr>
<div id="grammarList"></div>
</div>
</div>

</div>

<script>
let folders=JSON.parse(localStorage.getItem("folders"))||{}
let grammarData=JSON.parse(localStorage.getItem("grammarData"))||[]
let currentFolder=null
let flashIndex=0
let testWords=[],testIndex=0,score=0

function save(){localStorage.setItem("folders",JSON.stringify(folders))}
function saveGrammar(){localStorage.setItem("grammarData",JSON.stringify(grammarData))}

function showHome(){hideAll();homeSection.classList.remove("hidden")}
function showFlash(){hideAll();flashSection.classList.remove("hidden");loadFlashFolders()}
function showTest(){hideAll();testSection.classList.remove("hidden")}
function showGrammar(){hideAll();grammarSection.classList.remove("hidden");renderGrammar()}
function hideAll(){
homeSection.classList.add("hidden")
flashSection.classList.add("hidden")
testSection.classList.add("hidden")
grammarSection.classList.add("hidden")
}

function createFolder(){
let name=folderInput.value.trim()
if(!name)return
if(folders[name]){
alert("Folder already exists!")
return
}
folders[name]={vocab:[]}
currentFolder=name
folderInput.value=""
save();renderFolders();renderVocab()
}

function renameFolder(){
if(!currentFolder)return
let newName=prompt("New name:",currentFolder)
if(!newName || newName===currentFolder)return
if(folders[newName]){
alert("Folder name already exists!")
return
}
folders[newName]=folders[currentFolder]
delete folders[currentFolder]
currentFolder=newName
save();renderFolders();renderVocab()
}

function deleteFolder(name){
if(confirm("Delete folder?")){
delete folders[name]
if(currentFolder===name)currentFolder=null
save();renderFolders();renderVocab()
}
}

function renderFolders(){
folderList.innerHTML=""
Object.keys(folders).forEach(name=>{
let div=document.createElement("div")
div.className="folder-btn"+(currentFolder===name?" active":"")
div.innerHTML=name+
`<span class="delete-x" onclick="event.stopPropagation();deleteFolder('${name}')">❌</span>`
div.onclick=()=>{currentFolder=name;renderFolders();renderVocab()}
folderList.appendChild(div)
})
}

function addWord(){
if(!currentFolder)return
folders[currentFolder].vocab.push({
word:word.value.trim(),
meaning:meaning.value.trim(),
example:example.value.trim(),
tag:tag.value.trim(),
pos:pos.value
})
word.value=meaning.value=example.value=tag.value=""
pos.value=""
save();renderVocab()
}

function editWord(i){
let v=folders[currentFolder].vocab[i]
let w=prompt("Word:",v.word); if(w!==null)v.word=w
let m=prompt("Meaning:",v.meaning); if(m!==null)v.meaning=m
let e=prompt("Example:",v.example); if(e!==null)v.example=e
let t=prompt("Tag:",v.tag); if(t!==null)v.tag=t
let p=prompt("POS:",v.pos); if(p!==null)v.pos=p
save();renderVocab()
}

function renderVocab(){
vocabList.innerHTML=""
if(!currentFolder)return
folders[currentFolder].vocab.forEach((v,i)=>{
vocabList.innerHTML+=`
<b>${v.word}</b>
<span class="pos">${v.pos||""}</span>
 - ${v.meaning}
<span class="tag">${v.tag||""}</span>
<button onclick="editWord(${i})">Edit</button>
<button onclick="deleteWord(${i})">Delete</button><br>`
})
}

function deleteWord(i){
folders[currentFolder].vocab.splice(i,1)
save();renderVocab()
}

function loadFlashFolders(){
flashFolderSelect.innerHTML=""
Object.keys(folders).forEach(name=>{
flashFolderSelect.innerHTML+=`<option value="${name}">${name}</option>`
})
}

function startFlashcard(){
let folder=flashFolderSelect.value
if(!folder)return
let list=folders[folder].vocab
if(!list.length)return
currentFolder=folder
flashIndex=0
flashcard.classList.remove("hidden")
showFlashCard()
}

function showFlashCard(){
let v=folders[currentFolder].vocab[flashIndex]
flashcard.innerHTML=`<h2>${v.word}</h2><p>Click to flip</p>`
flashcard.dataset.state="word"
}

function flipCard(){
let list=folders[currentFolder].vocab
let v=list[flashIndex]
if(flashcard.dataset.state==="word"){
flashcard.innerHTML=`<h3>${v.meaning}</h3><p>${v.example||""}</p>`
flashcard.dataset.state="meaning"
}else{
flashIndex=(flashIndex+1)%list.length
showFlashCard()
}
}

function startTest(){
let type=testType.value
let limit=parseInt(questionLimit.value)||5
testIndex=0;score=0
testArea.classList.remove("hidden")

if(type==="word"){
if(!currentFolder)return
testWords=[...folders[currentFolder].vocab]
}else{
testWords=[...grammarData]
}

testWords=testWords.sort(()=>0.5-Math.random()).slice(0,limit)
nextQuestion()
}

function nextQuestion(){
if(testIndex>=testWords.length){
question.textContent="Finished!"
score.textContent="Score: "+score+"/"+testWords.length
return
}
let v=testWords[testIndex]
answerInput.value=""
feedback.textContent=""

if(testType.value==="word"){
question.textContent=(testMode.value==="vn-en")
?"Translate: "+v.meaning
:"Meaning of: "+v.word
}else{
question.textContent="Write formula for: "+v.title
}
}

answerInput.onkeydown=function(e){
if(e.key==="Enter"){
let v=testWords[testIndex]
let correct
if(testType.value==="word"){
correct=(testMode.value==="en-vn")?v.meaning:v.word
}else{
correct=v.formula
}
if(answerInput.value.trim().toLowerCase()===correct.trim().toLowerCase()){
score++;feedback.textContent="Correct!"
}else{
feedback.textContent="Wrong! Correct: "+correct
}
testIndex++
setTimeout(nextQuestion,800)
}
}

function addGrammar(){
let topic=grammarTitle.value.trim()
if(!topic)return
grammarData.push({
title:topic,
explanation:grammarExplanation.value,
formula:grammarFormula.value,
example:grammarExample.value
})
grammarTitle.value=""
grammarExplanation.value=""
grammarFormula.value=""
grammarExample.value=""
saveGrammar();renderGrammar()
}

function editGrammar(i){
let g=grammarData[i]
let t=prompt("Title:",g.title); if(t!==null)g.title=t
let e=prompt("Explanation:",g.explanation); if(e!==null)g.explanation=e
let f=prompt("Formula:",g.formula); if(f!==null)g.formula=f
let ex=prompt("Example:",g.example); if(ex!==null)g.example=ex
saveGrammar();renderGrammar()
}

function renderGrammar(){
grammarList.innerHTML=""
grammarData.forEach((g,i)=>{
grammarList.innerHTML+=`
<b>${g.title}</b>
<button onclick="editGrammar(${i})">Edit</button>
<button onclick="deleteGrammar(${i})">Delete</button>
<p>${g.explanation}</p>
<p><i>${g.formula}</i></p>
<hr>`
})
}

function deleteGrammar(i){
grammarData.splice(i,1)
saveGrammar();renderGrammar()
}

renderFolders()
renderGrammar()

let keys=Object.keys(folders)
if(keys.length){
currentFolder=keys[0]
renderFolders()
renderVocab()
}
</script>
</body>
</html>
